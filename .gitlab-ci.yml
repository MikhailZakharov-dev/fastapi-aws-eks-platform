stages:
  - lint
  - test
  - build
  - deploy
  - promote

variables:
  IMAGE: "$ECR_REGISTRY/talk-booking"

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --locked
    - uv run ruff check .

secrets:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    # У образа ENTRYPOINT — сам бинарь, а раннер запускает script через шелл.
    entrypoint: [""]
  variables:
    # Полная история: при shallow-клоне секрет из старого коммита не нашёлся бы.
    GIT_DEPTH: 0
  script:
    # --redact: без него найденное значение утекло бы ещё и в лог пайплайна.
    - gitleaks git --verbose --redact --no-banner .

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - echo "pytest"

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    # aws-cli is run from its official image (the Alpine package is broken on this base).
    - ECR_TOKEN=$(docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY amazon/aws-cli:2.36.2 ecr get-login-password --region "$AWS_REGION")
    - echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHA"

deploy-dev:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_STRATEGY: none
    GITOPS_HOST: "gitlab.com/beaviz0405/talk-booking-gitops.git"
    VALUES_FILE: "charts/talk-booking/values-dev.yaml"
  script:
    - |
      set -euo pipefail

      apk add --no-cache git
      git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_HOST}" gitops
      cd gitops
      git config user.email "ci@talk-booking"
      git config user.name "talk-booking CI"

      sed -i "s|^  tag: .*|  tag: \"$CI_COMMIT_SHA\"|" "$VALUES_FILE"
      # sed exits 0 even when nothing matched — verify the tag is actually there
      grep -q "tag: \"$CI_COMMIT_SHA\"" "$VALUES_FILE"

      if git diff --quiet; then
        echo "values already at $CI_COMMIT_SHA"
        exit 0
      fi

      git commit -am "chore(dev): bump image.tag to $CI_COMMIT_SHA ($CI_PIPELINE_URL)"

      # another commit may have landed between clone and push
      for i in 1 2 3; do
        if git pull --rebase && git push; then
          exit 0
        fi
        sleep 5
      done
      exit 1

promote-prod:
  stage: promote
  image: alpine:3.20
  # Продвижение — человеческое действие: джоба не стартует сама.
  # Ловушка: у ручных джоб allow_failure по умолчанию true, поэтому упавший
  # promote НЕ красит пайплайн. Смотреть надо саму джобу, а не значок сверху.
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_STRATEGY: none
    GITOPS_HOST: "gitlab.com/beaviz0405/talk-booking-gitops.git"
    VALUES_FILE: "charts/talk-booking/values-prod.yaml"
  script:
    - |
      set -euo pipefail

      apk add --no-cache git
      git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_HOST}" gitops
      cd gitops
      git config user.email "ci@talk-booking"
      git config user.name "talk-booking CI"

      BRANCH="promote-${CI_COMMIT_SHORT_SHA}"
      git checkout -b "$BRANCH"

      # Продвигаем ИМЕННО тот SHA, который эта же сборка отправила в dev,
      # а не HEAD gitops и не «последний собранный».
      sed -i "s|^  tag: .*|  tag: \"$CI_COMMIT_SHA\"|" "$VALUES_FILE"
      # sed возвращает 0, даже когда ничего не заменил
      grep -q "tag: \"$CI_COMMIT_SHA\"" "$VALUES_FILE"

      if git diff --quiet; then
        echo "prod уже на $CI_COMMIT_SHA — продвигать нечего"
        exit 0
      fi

      git commit -am "promote(prod): $CI_COMMIT_SHORT_SHA"

      # MR открывается push-опциями: отдельный токен для API не нужен.
      git push -o merge_request.create \
               -o merge_request.target=main \
               -o merge_request.title="promote(prod): $CI_COMMIT_SHORT_SHA" \
               -o merge_request.remove_source_branch \
               origin "$BRANCH"
